apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: subtrack-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://host.docker.internal/subtrack
    targetRevision: main
    path: k8s/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
