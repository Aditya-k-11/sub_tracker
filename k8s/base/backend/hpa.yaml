apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: subtrack
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  # DELIBERATE ASYMMETRY:
  # scaleUp is fast and eager (short 30s window, up to 2 pods per minute) to quickly handle traffic surges.
  # scaleDown is slow and cautious (5-minute window, removes 1 pod at a time) to prevent flapping (rapidly scaling down only to immediately need to scale back up).
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
