apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: subtrack
  labels:
    app: subtrack
    component: backend
spec:

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 10
  selector:
    matchLabels:
      app: subtrack
      component: backend
  template:
    metadata:
      labels:
        app: subtrack
        component: backend
    spec:
      containers:
        - name: backend
          image: adityakanojia11/subtrack-backend:bad21d3
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: subtrack-config
            - secretRef:
                name: subtrack-secret
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: backend-logs
              mountPath: /app/logs
          resources:
            requests:
              memory: "128Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
      volumes:
        - name: backend-logs
          persistentVolumeClaim:
            claimName: backend-logs-pvc
