apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: subtrack
  labels:
    app: subtrack
    component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      # maxUnavailable: 0 ensures Kubernetes NEVER takes down an existing pod until its replacement is up and ready.
      # Combined with maxSurge: 1, a rollout briefly runs 3 pods (2 old + 1 new), waits for the new one to pass readiness, 
      # removes 1 old pod, and repeats. Capacity never drops below 2.
      maxUnavailable: 0
  # minReadySeconds adds an extra 10s buffer AFTER a new pod passes readiness before considering it "available".
  # This makes rollouts slightly slower but gives much higher confidence that each new pod is genuinely stable.
  minReadySeconds: 10
  selector:
    matchLabels:
      app: subtrack
      component: frontend
  template:
    metadata:
      labels:
        app: subtrack
        component: frontend
    spec:
      containers:
        - name: frontend
          image: subtrack-frontend:v3
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            # Frontend resources retained from 10.3.
            # Frontend autoscaling is intentionally deprioritized in D.3 in favor of
            # focusing the HPA demonstration on the backend. A static Nginx server 
            # is extremely lightweight and rarely CPU-bound under demo-scale traffic.
            # Observed idle CPU is ~1m, memory ~9Mi, so these values remain very safe.
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
