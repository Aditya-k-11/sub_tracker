apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
data:
  red-method-dashboard.json: |
    {
      "title": "SubTrack - System Health (RED)",
      "uid": "subtrack-red",
      "tags": [
        "subtrack",
        "red"
      ],
      "timezone": "browser",
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "schemaVersion": 36,
      "panels": [
        {
          "id": 1,
          "title": "Request Rate",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum(rate(subtrack_http_requests_total[1m])) by (route)",
              "legendFormat": "{{route}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          }
        },
        {
          "id": 2,
          "title": "Error Rate (%)",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum(rate(subtrack_http_requests_total{status_code=~\"5..\"}[5m])) / sum(rate(subtrack_http_requests_total[5m])) * 100",
              "legendFormat": "Error Rate",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "title": "Latency Percentiles (p50/p95/p99)",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(subtrack_http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p99",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(subtrack_http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate(subtrack_http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p50",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "id": 4,
          "title": "Active Connections",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "expr": "subtrack_active_connections",
              "legendFormat": "Connections",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Requests by Status Code",
          "type": "timeseries",
          "gridPos": {
            "x": 8,
            "y": 16,
            "w": 16,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum(rate(subtrack_http_requests_total[1m])) by (status_code)",
              "legendFormat": "{{status_code}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Node/Process Health",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "expr": "rate(subtrack_process_cpu_seconds_total[1m])",
              "legendFormat": "CPU Usage",
              "refId": "A"
            },
            {
              "expr": "subtrack_process_resident_memory_bytes",
              "legendFormat": "Memory (RSS)",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "axisPlacement": "left"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Memory (RSS)"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  },
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 7,
          "title": "Pod Container Restarts",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "expr": "kube_pod_container_status_restarts_total{namespace=\"subtrack\"}",
              "legendFormat": "{{pod}} - {{container}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "decimals": 0
            }
          }
        }
      ]
    }
