apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      # Scrape targets every 15 seconds. This interval directly determines the time resolution of everything you'll graph in Grafana later.
      # Shorter intervals give finer-grained graphs at the cost of more scrape load. 15s is a reasonable default for this scale.
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'subtrack-backend'
        metrics_path: '/metrics'
        static_configs:
          # Note: Prometheus lives in 'observability' namespace, so it must use the fully-qualified DNS name to reach the backend in 'subtrack' namespace
          - targets: ['backend.subtrack.svc.cluster.local:5000']
            labels:
              app: 'subtrack'
              component: 'backend'

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.observability.svc.cluster.local:8080']
            labels:
              app: 'subtrack'
              component: 'kube-state-metrics'
