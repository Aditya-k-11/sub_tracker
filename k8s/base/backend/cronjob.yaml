# This Kubernetes CronJob replaces the local node-cron setup (ENABLE_LOCAL_CRON=false).
# Kubernetes natively owns the scheduling, executing the runRenewalScan.js script
# inside a dedicated one-off Job pod, cleanly decoupling background tasks from the main API server.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renewal-scan
  namespace: subtrack
  labels:
    app: subtrack
    component: backend
spec:
  # Run once daily at 9:00 AM (production schedule)
  schedule: "0 9 * * *"
  # Prevent a new job from starting if the previous one is still running
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: subtrack
            component: backend-cron
        spec:
          restartPolicy: Never
          containers:
            - name: renewal-scan
              image: subtrack-backend:local
              imagePullPolicy: Never
              command: ["node", "src/scripts/runRenewalScan.js"]
              envFrom:
                - configMapRef:
                    name: subtrack-config
                - secretRef:
                    name: subtrack-secret
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "200m"
              volumeMounts:
                - name: logs-volume
                  mountPath: /app/logs
          volumes:
            - name: logs-volume
              emptyDir: {}
