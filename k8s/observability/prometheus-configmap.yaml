apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.observability.svc.cluster.local:9093']

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: 'subtrack-backend'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['backend.subtrack.svc.cluster.local:5000']
            labels:
              app: 'subtrack'
              component: 'backend'

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.observability.svc.cluster.local:8080']
            labels:
              app: 'subtrack'
              component: 'kube-state-metrics'
