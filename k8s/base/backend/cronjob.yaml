apiVersion: batch/v1
kind: CronJob
metadata:
  name: renewal-scan
  namespace: subtrack
  labels:
    app: subtrack
    component: backend
spec:
  schedule: "0 9 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: subtrack
            component: backend-cron
        spec:
          restartPolicy: Never
          containers:
            - name: renewal-scan
              image: subtrack-backend:local
              imagePullPolicy: Never
              command: ["node", "src/scripts/runRenewalScan.js"]
              envFrom:
                - configMapRef:
                    name: subtrack-config
                - secretRef:
                    name: subtrack-secret
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "200m"
              volumeMounts:
                - name: logs-volume
                  mountPath: /app/logs
          volumes:
            - name: logs-volume
              emptyDir: {}
