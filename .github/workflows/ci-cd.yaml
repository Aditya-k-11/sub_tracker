name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - 'server/**'
      - '.github/workflows/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Using the default GITHUB_TOKEN to push changes back to the repo
          token: ${{ secrets.GITHUB_TOKEN }} 
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/subtrack-frontend:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/subtrack-frontend:latest
          
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/subtrack-backend:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/subtrack-backend:latest
          
      - name: Update Kubernetes Deployments
        run: |
          # Update frontend deployment using sed
          sed -i "s|image: .*subtrack-frontend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/subtrack-frontend:${{ steps.vars.outputs.sha_short }}|g" k8s/base/frontend/deployment.yaml
          
          # Update backend deployment using sed
          sed -i "s|image: .*subtrack-backend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/subtrack-backend:${{ steps.vars.outputs.sha_short }}|g" k8s/base/backend/deployment.yaml
          
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Commit and Push
          git add k8s/base/frontend/deployment.yaml k8s/base/backend/deployment.yaml
          # Using [skip ci] so this commit doesn't accidentally re-trigger workflows
          git commit -m "chore: update deployment image tags to ${{ steps.vars.outputs.sha_short }} [skip ci]" || echo "No changes to commit"
          git push origin main
