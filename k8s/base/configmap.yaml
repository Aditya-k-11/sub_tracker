apiVersion: v1
kind: ConfigMap
metadata:
  name: subtrack-config
  namespace: subtrack
  labels:
    app: subtrack
data:
  NODE_ENV: "production"
  PORT: "5000"
  ENABLE_LOCAL_CRON: "false" # In K8s, CronJob handles scheduling
  JWT_EXPIRES_IN: "7d"
  RENEWAL_REMINDER_WINDOW_DAYS: "3"
  TRIAL_REMINDER_WINDOW_DAYS: "2"
  WASTE_THRESHOLD_DAYS: "30"
  MIN_SUBSCRIPTION_AGE_DAYS: "14"
