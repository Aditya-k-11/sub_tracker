apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: subtrack
  labels:
    app: subtrack
    component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 10
  selector:
    matchLabels:
      app: subtrack
      component: frontend
  template:
    metadata:
      labels:
        app: subtrack
        component: frontend
    spec:
      containers:
        - name: frontend
          image: adityakanojia11/subtrack-frontend:67a5756
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
