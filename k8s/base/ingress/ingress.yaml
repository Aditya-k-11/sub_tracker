apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: subtrack-ingress
  namespace: subtrack
  labels:
    app: subtrack
    component: ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # IMPORTANT: Order matters! 
          # /api must come before / to ensure it doesn't get swallowed by the catch-all.
          # Note: This Ingress routes /api traffic directly to the backend Service,
          # completely bypassing the frontend's own Nginx proxy_pass rules.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
